name: CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  secrets:
    name: Credential & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Sensitive Files Are Not Tracked
        run: |
          if git ls-files --error-unmatch credentials.json 2>/dev/null; then
            echo "ERROR: credentials.json must never be committed!"
            exit 1
          fi
          tracked_logs=$(git ls-files '*.log' 'docs/reports/**' 'docs/net_docu_crawler/**')
          if [ -n "$tracked_logs" ]; then
            echo "ERROR: Sensitive log/report files are tracked:"
            echo "$tracked_logs"
            exit 1
          fi

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Code Quality & Linting (Ruff & Pre-Commit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linting & Quality Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pre-commit

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Ruff Format Check
        run: |
          ruff format --check .

  test:
    name: Cross-Platform Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    needs: [lint, secrets]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt

      - name: Run Pytest Test Suite
        run: |
          pytest -v
