[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "net-docu-crawler"
version = "1.0.0"
description = "Zero-blast-radius multi-vendor network discovery, topology resolution, and documentation engine."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Leif Davisson", email = "leifdavisson@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "netmiko>=4.0.0",
    "paramiko>=3.0.0",
    "netaddr>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0.0",
]

[project.scripts]
net-crawler = "net_docu_crawler.crawler:main"

[tool.setuptools]
py-modules = ["net_crawler", "oui_lookup", "parser", "report_generator"]

[tool.setuptools.packages.find]
include = ["net_docu_crawler*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (network CLI regex and banners)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise ... from err
]

[tool.ruff.lint.isort]
known-first-party = ["net_crawler", "net_docu_crawler", "oui_lookup", "parser", "report_generator"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
